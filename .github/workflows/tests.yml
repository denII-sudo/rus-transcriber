name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare isolated Windows test directories
        shell: pwsh
        run: |
          # обычная временная папка без особых путей: тесты должны работать на любом компьютере
          $testTemp = Join-Path $env:RUNNER_TEMP "rus-transcriber-temp"
          $testData = Join-Path $env:RUNNER_TEMP "rus-transcriber-data"
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          New-Item -ItemType Directory -Path $testData -Force | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "RUS_TRANSCRIBER_DATA=$testData" >> $env:GITHUB_ENV
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5
          mcp==2.3.0
          pymorphy3==2.0.6
          pymorphy3-dicts-ru==2.4.417150.4580142
          onnx-asr==0.12.0
          onnxruntime==1.32.0
      - name: Install CPU-only PyTorch
        run: >-
          python -m pip install --disable-pip-version-check
          torch==2.15.0
          --index-url https://download.pytorch.org/whl/cpu
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      # так же, как self_check у пользователя после обновления: свои временные папки и данные
      - name: Run self-check like an installed copy
        run: python -B selfcheck.py
