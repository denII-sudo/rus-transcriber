name: Tests

on:
  pull_request:
    branches: [main]
    # No ready_for_review: the commit is already tested, automerge.yml reuses that result.
    types: [opened, synchronize, reopened]
  # A push to main, a daily schedule and a manual run (workflow_dispatch) run the full suite sequentially, in one
  # process, as a control for the parallel run in pull requests: a hidden dependency between modules would show as
  # "green in parallel, red in sequence". A merge by automerge.yml (GITHUB_TOKEN) starts no push run, so for such
  # merges the daily schedule or a manual run is the control. The control also fills the dependency cache that
  # every PR can read (GitHub drops a cache unused for 7 days). automerge.yml ignores these runs: it queues only
  # pull_request ones.
  push:
    branches: [main]
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new commit in a PR makes the running check of its previous commit useless.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the merge commit of a PR and its first parent (main)
      # Среди тестов от docs/*.md и README.md зависит только test_text_hygiene. Любой другой файл,
      # событие не PR или сбой определения - полный набор.
      - name: Choose the test scope
        id: scope
        shell: pwsh
        run: |
          $scope = "full"
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $files = @(git -c core.quotePath=false diff --no-renames --name-only "HEAD^1" HEAD)
            if ($LASTEXITCODE -eq 0 -and $files.Count -gt 0 -and
                @($files | Where-Object { $_ -cnotmatch '^(docs/.+\.md|README\.md)$' }).Count -eq 0) {
              $scope = "docs"
            }
          }
          "scope=$scope" >> $env:GITHUB_OUTPUT
          Write-Output "Test scope: $scope"
          exit 0
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"
      # Пакеты заданы в этом файле, поэтому его хэш входит в ключ кэша.
      - name: Restore test dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/test-venv
          key: test-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.github/workflows/tests.yml') }}
      - name: Use the test environment
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.deps.outputs.cache-hit }}
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "test-venv"
          if ($env:CACHE_HIT -ne "true") {
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Join-Path $venv "Scripts" >> $env:GITHUB_PATH
      - name: Prepare isolated Windows test directories
        shell: pwsh
        run: |
          # обычная временная папка без особых путей: тесты должны работать на любом компьютере
          $testTemp = Join-Path $env:RUNNER_TEMP "rus-transcriber-temp"
          $testData = Join-Path $env:RUNNER_TEMP "rus-transcriber-data"
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          New-Item -ItemType Directory -Path $testData -Force | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "RUS_TRANSCRIBER_DATA=$testData" >> $env:GITHUB_ENV
      - name: Install lightweight test dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5
          mcp==2.3.0
          pymorphy3==2.0.6
          pymorphy3-dicts-ru==2.4.417150.4580142
          onnx-asr==0.12.0
          onnxruntime==1.32.0
      - name: Install CPU-only PyTorch
        if: steps.deps.outputs.cache-hit != 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          torch==2.15.0
          --index-url https://download.pytorch.org/whl/cpu
      # Сохраняется до тестов: упавший тест не должен стоить повторной установки пакетов.
      - name: Save test dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/test-venv
          key: ${{ steps.deps.outputs.cache-primary-key }}
      # В PR набор идёт параллельно: tests/run_parallel.py делит модули на 4 группы (по процессу unittest, у
      # каждой своя песочница). Состав групп детерминирован (по tests/parallel_durations.json), --shuffle меняет только порядок
      # модулей внутри групп; его seed печатается в журнале (повтор — --shuffle SEED).
      # Число тестов и состав модулей запускатель сверяет с discover; при падении печатает полный вывод группы.
      # --durations: секунды по тестам остаются в журнале, из него таблица раскладки пересчитывается одной командой:
      # python tests/run_parallel.py --table-from журнал.log
      - name: Run unit tests (parallel groups)
        if: steps.scope.outputs.scope != 'docs' && github.event_name == 'pull_request'
        run: python -B tests/run_parallel.py -v --shuffle --durations
      # Контроль по расписанию и на каждый push в main (слияние) — прежний последовательный прогон одним
      # процессом: «параллельно зелёно, последовательно красно» показало бы скрытую зависимость модулей.
      - name: Run unit tests (sequential control)
        if: steps.scope.outputs.scope != 'docs' && github.event_name != 'pull_request'
        run: python -B -m unittest discover -s tests -v
      - name: Run text tests for a documentation-only change
        if: steps.scope.outputs.scope == 'docs'
        run: python -B -m unittest discover -s tests -p test_text_hygiene.py -v
      # Остальные проверки самопроверки установленной копии (файлы на личные данные, морфология,
      # сведения о сборке) без повторного запуска набора: selfcheck.py без --no-tests прогонял бы
      # те же тесты второй раз (около 2,5 минут). Сама самопроверка с тестами проверяется
      # tests/test_selfcheck.py и при установке (шаг 11 install.ps1).
      - name: Run self-check checks without repeating the unit tests
        run: python -B rt.py self-check --no-tests
      # Личные слова (имена, названия групп) хранятся в секрете репозитория RUS_FORBIDDEN_WORDS,
      # по одному в строке. Журнал публичный: --hide-words выводит только файл и строку, без слова.
      # PR из форков секрет не получают — там проверка пропускается с пометкой.
      # В PR скрипт берётся из базового коммита (первый родитель merge-коммита, HEAD^1), а файлы проверяются
      # из дерева PR (--root .): автор PR не может подменить сам tools/check_repo.py. Это частичная защита:
      # для события pull_request GitHub берёт и сам tests.yml из PR, так что правкой этого файла секрет
      # по-прежнему можно вывести; такие правки закрывает ревью код-владельца (.github/ в CODEOWNERS).
      # На push, по расписанию и вручную (main) проверка идёт скриптом из дерева, как раньше.
      - name: Check tracked files for private words
        shell: pwsh
        env:
          FORBIDDEN_WORDS: ${{ secrets.RUS_FORBIDDEN_WORDS }}
        run: |
          if (-not $env:FORBIDDEN_WORDS) {
            Write-Output "::notice::RUS_FORBIDDEN_WORDS is not available (fork PR or secret not set): private-word check skipped."
            exit 0
          }
          $list = Join-Path $env:RUNNER_TEMP "forbidden-words.txt"
          [IO.File]::WriteAllText($list, $env:FORBIDDEN_WORDS, (New-Object Text.UTF8Encoding $false))
          $env:RUS_FORBIDDEN_WORDS = $list
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $baseScript = Join-Path $env:RUNNER_TEMP "base-check-repo.py"
            # python пишет байты как есть: без перекодировки, которая зависит от версии PowerShell
            python -B -c "import subprocess, sys; open(sys.argv[2], 'wb').write(subprocess.run(['git', 'show', sys.argv[1]], check=True, capture_output=True).stdout)" "HEAD^1:tools/check_repo.py" $baseScript
            if ($LASTEXITCODE -ne 0) {
              Remove-Item $list -Force
              Write-Output "::error::Could not read tools/check_repo.py from the base commit (HEAD^1): private-word check NOT done."
              exit 1
            }
            python -B $baseScript --root . --hide-words
          } else {
            python -B tools/check_repo.py --hide-words
          }
          $code = $LASTEXITCODE
          Remove-Item $list -Force
          exit $code
