name: Queue passing pull requests

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions: {}

jobs:
  queue:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # This privileged workflow deliberately does not check out or execute
      # pull-request code. It only updates a behind PR branch or enables
      # GitHub's built-in auto-merge after confirming the open PR matches the
      # SHA whose Tests workflow just passed. An updated branch must pass Tests
      # again before it can be queued. Branch protection remains responsible
      # for the code-owner approval requirement.
      - name: Update or queue the passing PR
        shell: bash
        run: |
          prs="$(gh pr list --repo "$REPOSITORY" --state open --base main --limit 1000 \
            --json number,headRefOid,isDraft \
            --jq ".[] | select(.headRefOid == \"${TESTED_SHA}\" and .isDraft == false) | .number")"
          if [ -z "$prs" ]; then
            # Draft PRs are left alone: GitHub refuses auto-merge for drafts.
            # Marking a PR ready for review re-runs Tests, which queues it here.
            echo "No open non-draft pull request for tested commit ${TESTED_SHA}."
            exit 0
          fi
          while IFS= read -r pr; do
            case "$pr" in
              ''|*[!0-9]*)
                echo "Skipping unexpected pull-request number."
                exit 1
                ;;
            esac
            merge_state="$(gh pr view "$pr" --repo "$REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)"
            if [ "$merge_state" = "BEHIND" ]; then
              echo "PR #${pr} is behind main; requesting a branch update."
              gh pr update-branch "$pr" --repo "$REPOSITORY"
              continue
            fi
            gh pr merge "$pr" --repo "$REPOSITORY" --auto --squash
          done <<< "$prs"
