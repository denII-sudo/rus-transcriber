# Dependabot следит только за версиями действий GitHub Actions в .github/workflows (actions/checkout и др.).
# Пакеты Python не трогает: они закреплены в тексте tests.yml, а не в файле зависимостей.
# Раз в месяц, одним сгруппированным PR; открытых PR не больше двух. Слияние — по слову владельца:
# automerge.yml PR от Dependabot в очередь не ставит.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
