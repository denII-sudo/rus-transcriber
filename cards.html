<title>Разбор расшифровки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Лента карточек: сводка сверху, одна колонка мест; у каждого — клип, реплика с местом, вопрос, варианты. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#d9dfd9;
  --accent:#0d6e5b; --accent-ink:#ffffff; --mark:#f5d76e; --mark-ink:#1d2420;
  --ok:#2f7d3a; --warn:#a15c00; --info:#2c5aa0;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --fg:#e4ebe6; --muted:#9aa8a0; --line:#2e3833;
  --accent:#3fb59a; --accent-ink:#0b1310; --mark:#8a7322; --mark-ink:#fff6d6;
  --ok:#6cc27a; --warn:#e2a64b; --info:#7fa8e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --fg:#e4ebe6; --muted:#9aa8a0; --line:#2e3833;
  --accent:#3fb59a; --accent-ink:#0b1310; --mark:#8a7322; --mark-ink:#fff6d6;
  --ok:#6cc27a; --warn:#e2a64b; --info:#7fa8e6; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:16px}
header{display:grid;gap:8px}
h1{font:600 1.55rem/1.15 var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--muted);margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.meter{flex:1 1 180px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.count{font:500 .9rem var(--f-mono);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px}
.chip{font:500 .78rem var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);background:transparent}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{border-left:3px solid var(--info);padding:6px 10px;color:var(--muted);background:var(--surface);font-size:.9rem}
.note[data-kind="warn"]{border-color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card[data-done="1"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.tc{font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums}
.who{font-weight:600}
.reasons{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.ctx{display:grid;gap:4px;font-size:.93rem;min-width:0}
.ctx .side{color:var(--muted)}
.ctx p{margin:0;overflow-wrap:anywhere;white-space:pre-line}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}
audio{width:100%;height:36px}
.q{font-weight:600;margin:0}
.opts{display:grid;gap:6px}
.opt:disabled{opacity:.55;cursor:not-allowed}
.opt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:flex-start;text-align:left;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .n{font:500 .85rem var(--f-mono);color:var(--muted);min-width:1.2em}
.opt .lbl{flex:1 1 0;min-width:8em;overflow-wrap:anywhere}
.opt small{flex:1 1 100%;min-width:0;padding-left:calc(1.2em + 10px);color:var(--muted);overflow-wrap:anywhere}
.opt[aria-pressed="true"] small{color:var(--accent-ink)}
.opt .rec{font:500 .72rem var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt[aria-pressed="true"] .n,.opt[aria-pressed="true"] .rec{color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 .88rem var(--f-body);padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--fg)}
/* КН-12: неактивная кнопка видно неактивна и не подсвечивается при наведении */
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover:not(:disabled){border-color:var(--fg)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn.rec-on{background:#c0392b;color:#fff;border-color:#c0392b}
.free{display:flex;gap:8px;flex-wrap:wrap}
.free input{flex:1 1 220px;min-width:0;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.state{font-size:.86rem;color:var(--muted);min-height:1.2em}
.state b{color:var(--ok);font-weight:600}
.last{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line))}
.last .k{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ok)}
.last .v{font-weight:600;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;flex:1 1 100%}
.last .m{font:400 .8rem var(--f-mono);color:var(--muted)}
.card[data-applied="1"] .opts,.card[data-applied="1"] .row,.card[data-applied="1"] .free{display:none}
/* 9.3: ответ на этой карточке не внесётся — прежний вопрос свёрнут, вариантов и своего поля нет */
.stale{display:grid;gap:6px}
.stale b{color:var(--warn)}
.stale details{color:var(--muted)}
.stale details ol{margin:4px 0 0;padding-left:1.4em}
.edit-row{display:none;flex-wrap:wrap;gap:8px}
.card[data-applied="1"] .edit-row{display:flex}
.last[data-pending="1"]{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.last[data-pending="1"] .k{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#list{display:grid;gap:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1 id="title">Разбор расшифровки</h1>
    <p class="sub" id="sub">Загружаю пакет разбора…</p>
    <div class="bar">
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <span class="count" id="count">0 / 0</span>
      <div class="filters" role="group" aria-label="Показать">
        <button class="chip" id="f-open" aria-pressed="true">без ответа</button>
        <button class="chip" id="f-all" aria-pressed="false">все</button>
      </div>
    </div>
    <div class="note" id="mode-note" hidden></div>
    <button class="btn" id="apply" type="button" hidden>Применить сохранённые ответы</button>
    <div class="note" id="apply-report" hidden aria-live="polite"></div>
  </header>
  <main id="list"><div class="empty" id="empty">Пакет ещё не загружен. Здесь появятся сомнительные места расшифровки: клип, реплика с выделенным местом и варианты ответа.</div></main>
</div>

<script>
(() => {
  "use strict";
  const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const REASONS = {asr: "модели расходятся", conf: "модель не уверена", voice: "голоса похожи",
                   overlap: "говорят вместе", gender: "род глагола", missed: "пропущена речь",
                   contradiction: "противоречие"};
  const NUM = ["1", "2", "3", "4"];
  // К-6: у места сбоя прохода (asr_state не disagreement) чип не говорит «модели расходятся»
  const chipText = (it, r) => r === "asr" && it.asr_state && it.asr_state !== "disagreement" ? "сбой распознавания" : REASONS[r] || r;
  let man = null, answers = {}, live = {}, showAll = false, api = null;
  const pageSession = typeof window !== "undefined" && window.crypto && window.crypto.randomUUID ?
    window.crypto.randomUUID() :
    `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  // Номер редакции карточки: замена карточки в том же пакете растит его; ответ и событие несут номер своей редакции.
  const revOf = (it) => (it && it.rev) || 1;
  const STALE = "вопрос обновлён";
  const visibleThisSession = new Set();          // «id#редакция»: заменённая карточка показывается заново
  // И4: отметки просмотра и прослушивания — диагностика, на ответы не влияют; отказ записи — одно предупреждение
  // на сессию страницы. Отказ «вопрос обновлён» — без предупреждения: карточку заменяют.
  const EVENTS_FAILED = "Часть отметок о просмотре и прослушивании не записана; на ответы это не влияет";
  let eventsFailed = 0, eventsWarned = false;
  const sendInteraction = (it, type) => {
    if (api && api.event) api.event({id: it.id, version: man.version, rev: revOf(it), type, session: pageSession}).then(j => {
      // база не обновлена (Х1): отметка не записана, программа объясняет почему — одно предупреждение на сессию
      if (j && j.warning && !eventsWarned) { eventsWarned = true; note(j.warning, "warn"); }
    }).catch(e => {
      if (e && e.message === STALE) return;
      if (++eventsFailed === 1) note(EVENTS_FAILED, "warn");
    });
  };
  const cardObserver = typeof window !== "undefined" && "IntersectionObserver" in window ?
    new window.IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting || entry.intersectionRatio < 0.5) return;
      const id = entry.target.dataset.id, key = `${id}#${entry.target.dataset.rev}`;
      if (visibleThisSession.has(key)) return;
      visibleThisSession.add(key);
      const it = man.items.find(item => item.id === id);
      if (it) sendInteraction(it, "card_visible");
      cardObserver.unobserve(entry.target);
    });
    }, {threshold: 0.5}) : null;
  const editing = new Set();          // карточки с применённым ответом, которые сейчас меняют
  // Раздел 10: кнопка «Я прослушал…» доступна, когда весь отрезок места (clip_t1…clip_t2) хотя бы раз проигран:
  // можно частями, перемотка не в счёт (audio.played). Прослушанное раньше сообщает программа (heard_ids).
  const HEARD_TOL = 0.2;
  const LISTEN_FIRST = "Сначала прослушайте место целиком — кнопки прослушивания станут доступны (можно частями, перемотка не в счёт)";
  const NO_CLIP_LISTEN = "Звук места недоступен — ответьте своим текстом";
  const CLIP_FAILED = "Звук места не загрузился: файла клипа нет или он не открывается.";
  // шаг А: звук места не загрузился в этой сессии страницы («id#редакция») — кнопок прослушивания нет, как без клипа
  const clipFailed = new Set();
  const clipFailedNote = () => Object.assign(document.createElement("p"), {className: "side clip-failed", textContent: CLIP_FAILED});
  const playedSpans = {};          // «id#редакция» → слитые проигранные куски клипа в этой сессии страницы
  const heardHere = new Set();     // «id#редакция»: отрезок места проигран целиком в этой сессии
  const isListen = (o) => !!(o && o.decision && o.decision.listened);
  const heardOf = (it) => heardHere.has(`${it.id}#${revOf(it)}`) || (man.heard_ids || []).includes(it.id);
  const mergeSpans = (spans) => spans.slice().sort((x, y) => x[0] - y[0]).reduce((out, [x, y]) => {
    const last = out[out.length - 1];
    if (last && x <= last[1] + HEARD_TOL) last[1] = Math.max(last[1], y); else out.push([x, y]);
    return out;
  }, []);
  const spansCover = (spans, a, b) => mergeSpans(spans).some(([x, y]) => x <= a + HEARD_TOL && y >= b - HEARD_TOL);
  function trackPlayed(it, au, c) {
    const key = `${it.id}#${revOf(it)}`, r = au.played, add = [];
    for (let i = 0; i < r.length; i++) add.push([r.start(i), r.end(i)]);
    playedSpans[key] = mergeSpans((playedSpans[key] || []).concat(add));
    if (heardHere.has(key) || !spansCover(playedSpans[key], Number(it.clip_t1), Number(it.clip_t2))) return;
    heardHere.add(key);
    sendInteraction(it, "place_heard");     // программа запишет отрезок места из карточки, а не со страницы
    c.querySelectorAll("button.opt[data-listen]").forEach(b => { b.disabled = false; b.title = ""; });
    const h = c.querySelector(".listen-hint"); if (h) h.remove();
  }
  // вид ответа: страница в облаке пишет свободный текст без kind — тогда это свой ответ
  const kindOf = (a) => a.kind || (a.option != null ? "option" : (a.text ? "free" : ""));
  // Состояние ответа считает программа на ноутбуке (answer_states): страница его только показывает.
  // Ответ, которого ноутбук ещё не видел (облако), — «сохранён в облаке»; страничное исключение —
  // «Не отменять» из облака (cloud_keep): до переноса на ноутбук применённый ответ на месте.
  const stateOf = (it, a) => {
    if (!a) return "";
    const st = (man.answer_states || {})[it.id];
    if (st && st.ts === a.ts && st.source === a.source) return st.state;
    if (LOCAL) return "saved";
    if (kindOf(a) === "keep") return "cloud_keep";
    // К-16: отмена из облака у применённого ответа — до переноса на ноутбук правка на месте
    if (kindOf(a) === "revert" && (man.applied_answers || {})[it.id]) return "cloud_revert";
    return "cloud_saved";
  };
  // «Не отменять» из облака, который ноутбук уже обработал (принял или отклонил): страница показывает
  // ответ программы, а не свой запрос.
  const keepSeen = (a) => {
    const k = ((man.answer_states || {})[a.id] || {}).keep;
    return kindOf(a) === "keep" && !!k && k.ts === a.ts && k.source === a.source;
  };
  const whyOf = (it) => ((man.answer_states || {})[it.id] || {}).why || "";
  const detailOf = (it) => ((man.answer_states || {})[it.id] || {}).detail || "";
  // В-1: у внесённого ответа нет снимка — со страницы его не отменить и не заменить
  const undoOf = (it) => ((man.answer_states || {})[it.id] || {}).undo;
  // 9.3: признаки карточки от программы (card_conditions, только на ноутбуке): место сейчас открыто; ответ на этой
  // карточке не внесётся (её собрали по версии стенограммы, которой нет в базе). У внесённого ответа — обычный вид.
  const conditionOf = (it) => ((man && man.card_conditions) || {})[it.id] || {};
  const cannotApply = (it, a) => LOCAL && !!conditionOf(it).cannot_apply && !holdsApplied(it, a);
  // применённая правка на месте: прежний ответ (новый ждёт отмены или не меняет его)
  // undo_conflict: отмена не выполнилась — прежняя правка на месте, кнопки «Изменить» и «Отмена» нужны
  // revert_pending: отмена подготовлена, но не применена — правка тоже ещё на месте
  // cloud_keep: отмена снята в облаке — применённая правка на месте
  // applied_open: ответ применён, место осталось открытым (PR 7) — правка на месте, отмена доступна
  // applied_check: применён более поздний из расходившихся ответов ноутбука и облака (К-23) — проверить
  // cloud_revert: отмена сохранена в облаке (К-16) — применённая правка на месте
  // replaceRefused: новый ответ не внесён, прежний внесённый на месте (К-В3 — отказ снятия, К-В4 — возврат прежнего)
  const holdsApplied = (it, a) => ["applied", "applied_open", "applied_check", "pending_new", "kept_previous",
                                   "undo_conflict", "revert_pending", "cloud_keep", "cloud_revert"].includes(stateOf(it, a)) ||
                                  replaceRefused(it, a);
  // К-13: отвечено — ответ сохранён и не требует действия; эти исходы ждут нового ответа или проверки.
  // В облаке состояния до переноса на ноутбук неизвестны: там отвечено всё, на что есть ответ.
  const NEEDS_ANSWER = ["negative", "hint", "pause_refused", "listen_mismatch", "apply_conflict", "blocked_preflight",
                        "source_conflict", "not_found", "not_applied", "reverted", "applied_open", "applied_check",
                        "not_heard", "left_for_human"];
  // карточка, где ответ не внесётся (9.3), — «без ответа», пока её не оставили как есть («Пропустить»)
  const needsAnswer = (it) => {
    const a = answers[it.id];
    return !a || (LOCAL && ((NEEDS_ANSWER.includes(stateOf(it, a)) && !replaceRefused(it, a)) ||
                            (cannotApply(it, a) && kindOf(a) !== "skip")));
  };
  // ответы, которые ждут «Применить»: их число — на кнопке (КН-10)
  const WAITING = ["saved", "pending_new", "revert_pending"];
  const waitingCount = () => man.items.filter(it => answers[it.id] && WAITING.includes(stateOf(it, answers[it.id]))).length;
  const applyLabel = () => "Применить сохранённые ответы" + (LOCAL && waitingCount() ? ` (${waitingCount()})` : "");
  // Кнопки внесённого ответа (строка edit-row): confirm — «Ответ верен — оставить» (applied_check), back — «Вернуть
  // как было» (новый ответ поверх внесённого ждёт «Применить»; К-В3 — и со снимком), edit — «Изменить ответ»,
  // keep — «Не отменять» при подготовленной отмене. «Отменить ответ» — в режиме изменения (revertInEdit, К-В3).
  // Без снимка (undo === false) edit нет: ответ со страницы не заменить.
  const appliedActions = (it, a) => {
    const st = stateOf(it, a), noUndo = undoOf(it) === false, out = [];
    if (LOCAL && st === "applied_check" && confirmAnswer(it)) out.push("confirm");
    if (st === "pending_new" || (!noUndo && replaceRefused(it, a))) out.push("back");
    if (!noUndo) out.push("edit");
    if (!noUndo && revertButton(it, a).kind === "keep") out.push("keep");
    return out;
  };
  // К-В3: «Отменить ответ» — второй явный шаг после «Изменить ответ» (затем «Применить»)
  const revertInEdit = (it, a) => editing.has(it.id) && holdsApplied(it, a) && undoOf(it) !== false &&
    revertButton(it, a).kind === "revert";
  // Пустой список «без ответа»: есть ли что применять
  const emptyText = () => {
    if (!LOCAL) return "Все места разобраны. Ответы перенесёт на ноутбук Claude — скажите ему «применяй ответы». Нажмите «все», чтобы увидеть карточки с ответами.";
    return waitingCount() ? "Ответы сохранены. Для изменения стенограммы нажмите «Применить сохранённые ответы». Нажмите «все», чтобы увидеть карточки."
      : "Все места разобраны, применять нечего. Нажмите «все», чтобы увидеть карточки.";
  };
  // «Ответ верен — оставить» (К-23): тот же применённый ответ ещё раз от человека на ноутбуке закрывает место
  const confirmAnswer = (it) => {
    const sig = (man.applied_answers || {})[it.id];
    if (!Array.isArray(sig)) return null;
    const [kind, option, text] = sig;
    if (kind === "option" && option != null) return {option};
    if (kind === "recommended") return {kind};
    if (kind === "free" && text) return {kind, text};
    return null;
  };
  const hasConflict = (it) => (man.conflicts || []).some(c => c.id === it.id);
  // Отмена применённого ответа: при подготовленной отмене — «Не отменять» (строка edit-row), иначе — «Отменить ответ»
  // (в режиме изменения, К-В3; было — «Подготовить отмену» рядом с «Изменить ответ»). В-1: без снимка (undo === false)

  async function cloudApi() {
    const db = await claude.use("db");

    return {
      voiceMode: assets ? "file" : null,
      async load() { const s = await col.get(); live = pick(s.docs.map(d => d.data())); return merge(); },
      async answer(a) {
        const doc = {...a, source: "cloud", ts: new Date().toISOString().slice(0, 19)};

      },
      async voice(it, file) {

      }
    };
  }

  function note(text, kind) { const n = $("mode-note"); n.textContent = text; n.dataset.kind = kind || ""; n.hidden = !text; }

  function optionPreview(decision) {
    const d = decision || {}, parts = [];
    if (d.text) parts.push(`текст → «${d.text}»`);
    if (d.speaker) parts.push(`говорящий → ${d.speaker}`);
    if (d.human_after || d.status === "human") parts.push("оставить человеку для проверки");
    if (d.reopen) parts.push("снова открыть место");
    if (d.listened === "silence") parts.push("подтвердить после прослушивания: тишина");
    if (d.listened === "words") parts.push("подтвердить после прослушивания: слова верны");
    if (d.listened === "interjections") parts.push("подтвердить после прослушивания: только междометия, не записывать");
    if (d.note) parts.push(`примечание: ${d.note}`);
    // номера слов человеку ничего не говорят: показываем, сколько слов места подтверждается
    if (Array.isArray(d.word_ids)) parts.push(`подтвердить говорящего у слов места (${d.word_ids.length})`);
    // К-1: противоречие — без служебных имён и хэша предложения
    if (d.contradiction) parts.push(d.contradiction === "keep" ? "слова не меняются, противоречие закрывается" : "противоречие закрывается");
    const other = Object.keys(d).filter(k => !["text", "speaker", "human_after", "status", "reopen", "note", "listened", "word_ids",
                                               "contradiction", "proposal"].includes(k));
    if (other.length) parts.push("другие параметры: " + other.map(k => `${k}: ${JSON.stringify(d[k])}`).join(", "));
    return parts.join("; ") || "оставить как есть";
  }

  // ---------- отрисовка ----------
  function markReply(reply) {
    const frag = document.createDocumentFragment();
    String(reply || "").split(/(⟦[^⟧]*⟧)/).forEach(part => {
      if (part.startsWith("⟦")) { const m = document.createElement("mark"); m.textContent = part.slice(1, -1); frag.append(m); }
      else frag.append(document.createTextNode(part));

  }
  function describe_unused(a, it) {
    if (!a) return "";
    const src = a.source === "local" ? "ноутбук" : "облако";
    const when = (a.ts || "").replace("T", " ").slice(5, 16);
    let what = {human: "оставлено человеку", skip: "пропущено", voice: "голосовой ответ, ждёт распознавания на ноутбуке",

    if ((a.kind === "option" || a.kind === "recommended") && a.option != null) what = `вариант ${a.option + 1}: ${it.options[a.option].label}`;
    return `Ответ (${src}, ${when}): ${what || a.kind}` + (a.heard && a.text && a.kind !== "free" ? ` — услышано «${a.text}»` : "");
  }
  function when(ts) {
    if (!ts) return "";
    const d = new Date(/Z$|[+-]\d\d:?\d\d$/.test(ts) ? ts : ts + "Z");
    return isNaN(d) ? ts : d.toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  }
  function lastAnswer(a, it) {
    const box = document.createElement("div"); box.className = "last";
    const what = answerText(a, it);
    const k = document.createElement("span"); k.className = "k";
    k.textContent = cardStatus(it, a);
    if (pending(it, a) || cannotApply(it, a)) box.dataset.pending = "1";      // 9.3: ответ не внесётся — жёлтым
    const v = document.createElement("span"); v.className = "v"; v.textContent = what;
    const m = document.createElement("span"); m.className = "m";
    m.textContent = answerMeta(a);
    box.append(k, v, m);
    const note = programNote(it, a);
    if (note) { const w = document.createElement("span"); w.className = "m"; w.textContent = note; box.append(w); }
    if (hasConflict(it)) { const w = document.createElement("span"); w.className = "m conflict"; w.textContent = CONFLICT_TEXT; box.append(w); }
    return box;
  }
  function speak(it) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const text = `${it.question} ` + it.options.map((o, k) => `Вариант ${k + 1}: ${o.label}.`).join(" ")
      + (it.recommended != null ? ` Рекомендую вариант ${it.recommended + 1}.` : "");
    const u = new SpeechSynthesisUtterance(text); u.lang = "ru-RU";
    const v = speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  // Результат голосового ответа (api/voice): «повтори» — вопрос звучит заново, ответ не сохраняется (К-12);
  // иначе — услышанное, предполагаемый ответ и «Подтвердить».
  function voiceResult(it, r, state) {
    const p = voiceProposal(r, it);
    if (p.repeat) { speak(it); state.textContent = REPEAT_TEXT; return p; }
    state.replaceChildren(document.createTextNode(`Услышано: «${r.heard || ""}». Предполагаемый ответ: ${p.text}. `));
    const edit = document.createElement("input"); edit.value = r.heard || ""; edit.setAttribute("aria-label", "Исправить распознанный текст");
    const confirm = document.createElement("button"); confirm.type = "button"; confirm.textContent = "Подтвердить";
    confirm.onclick = () => { if (edit.value.trim()) send(it, {text: edit.value.trim(), heard: true}, state); };
    const repeat = document.createElement("button"); repeat.type = "button"; repeat.textContent = "Повторить";
    repeat.onclick = () => { state.textContent = "Запишите ответ заново."; };
    state.append(edit, confirm, repeat);

  // примечание человека — только на карточке противоречия (PR 13б, В-3); ответом оно не разбирается
  function humanNote(it, stateEl) {
    const el = it.seen_fp && stateEl.parentElement && stateEl.parentElement.querySelector(".human-note");
    return el ? el.value.trim() : "";
  }
  async function send(it, a, stateEl) {
    stateEl.textContent = "Сохраняю…";
    editing.delete(it.id);
    try {
      // К-2: «Пропустить» примечание не отправляет — оно сохраняется с вариантом, своим ответом или «Оставить человеку»
      const typed = humanNote(it, stateEl), skip = a.kind === "skip", note = skip ? "" : typed;
      const r = await api.answer({id: it.id, version: man.version, rev: revOf(it), ...a, ...(note ? {human_note: note} : {})});
      const acc = (r.accepted || [])[0];
      const rejected = r.rejected && r.rejected.length;
      render();
      // К-17: свой текст остаётся в поле; вариант или кнопку нужно выбрать заново
      if (rejected && r.rejected[0].why === STALE) flash(it.id, a.text ? STALE_TEXT : STALE_CHOICE_TEXT);
      else if (rejected) flash(it.id, "Не принято: " + r.rejected[0].why);
      else if (skip && typed) flash(it.id, SKIP_NOTE_TEXT);
      else if (acc && acc.note) flash(it.id, "Не записано: " + acc.note);
      else if (a.kind === "keep") flash(it.id, "Применённый ответ остаётся: подготовленная отмена или новый ответ сняты");
      else if (a.kind === "revert") flash(it.id, "Отмена подготовлена: нажмите «Применить сохранённые ответы»");
      else flash(it.id, acc && acc.answer ? "Сохранено (ещё не применено): " + acc.answer : "Ответ записан");
    } catch (e) { stateEl.textContent = "Не сохранилось: " + e.message; }
  }
  const STALE_TEXT = "Не принято: вопрос обновлён — карточка показана заново, ваш текст остался в поле";
  const STALE_CHOICE_TEXT = "Не принято: вопрос обновлён — карточка показана заново, выберите ответ ещё раз";
  const STALE_LOAD_FAILED = "Не принято: вопрос обновлён, а новую редакцию загрузить не удалось — обновите страницу";
  const RETURN_FAILED = "Не удалось обновить карточки после возврата на вкладку — обновите страницу";
  const SKIP_NOTE_TEXT = "Пропущено. Примечание не записано: оно сохраняется с выбором варианта, своим ответом или «Оставить человеку»";
  // Отказ «вопрос обновлён» на голос или предпросмотр: забрать новую редакцию и показать её. Не загрузилась —
  // карточка не перерисовывается и не называется «показанной заново» (И1).
  async function staleShown(e, it, text) {
    if (!e || e.message !== STALE) return false;
    try { answers = await api.load(); } catch (_) { flash(it.id, STALE_LOAD_FAILED); return true; }
    render();
    flash(it.id, text || STALE_TEXT);
    return true;
  }
  // Возврат на вкладку: карточки могли замениться. Неудача — предупреждение вверху, а не молчание (И1);
  // следующая удачная загрузка его снимает (другие предупреждения не трогает).
  function refreshOnReturn() {
    return api.load().then(a => {
      answers = a; render(); if ($("mode-note").textContent === RETURN_FAILED) note("");
    }).catch(() => note(RETURN_FAILED, "warn"));
  }
  function flash(id, text) { const el = document.querySelector(`[data-id="${id}"] .state`); if (el) el.textContent = text; }

  // Прежние редакции заменённой карточки и ответы на них: на новый вопрос ответ не переносится.
  function historyNote(it) {
    const box = document.createElement("div"); box.className = "note"; box.style.whiteSpace = "pre-line";
    box.textContent = it.history.map(h => {
      const a = h.answer, opts = h.options || [];
      let what = "ответа не было";
      // К-21: сначала вид ответа (пропуск, отмена, «Оставить человеку»), потом вариант и текст
      const kind = a && kindOf(a);
      if (a) what = (kind === "skip" ? "ответ: пропущено" : kind === "revert" ? "ответ: отмена ответа" :
        kind === "human" ? "ответ: оставлено человеку" + (a.text ? ` («${a.text}»)` : "") :
        a.option != null && opts[a.option] ? `ответ: ${a.option + 1} — ${opts[a.option].label}` :
        a.text ? `ответ: «${a.text}»` : "ответ: " + (kind || "без вида")) +
        // К-8: применённая правка осталась в стенограмме; ждущий ответ на новую редакцию не перенесён
        (h.applied ? " (был применён к стенограмме; правка осталась — отменить её с карточки нельзя, " +
                     "исправьте ответом на эту карточку или правкой отрезка)" :
         h.applied === false ? " (не применён: ответьте на новой редакции)" : "");
      return `Прежний вопрос (редакция ${h.rev}${h.why ? ", " + h.why : ""}): «${h.question || ""}» — ${what}.`;
    }).join("\n");
    return box;
  }
  // Готовая карточка перерисовывается, только если изменилось то, что на ней показано: так сохраняются набранный
  // текст, идущая запись голоса и сообщения у остальных карточек.
  // К-24: у применённого или отменённого ответа реплика на карточке — снимок на момент вопроса
  const ASKED_TEXT = "текст на момент вопроса — в стенограмме он может быть другим";
  const showsAskedText = (it, a) => !!a && (holdsApplied(it, a) || stateOf(it, a) === "reverted");
  const cardCache = new Map();
  const cardSig = (it) => JSON.stringify([man.version, revOf(it), answers[it.id] || null, (man.answer_states || {})[it.id] || null,
    editing.has(it.id), (man.conflicts || []).some(c => c.id === it.id), !!man.clips_removed, api && api.voiceMode, heardOf(it),
    conditionOf(it), clipFailed.has(`${it.id}#${revOf(it)}`)]);
  function cardFor(it) {
    const sig = cardSig(it), hit = cardCache.get(it.id);
    if (hit && hit.sig === sig) return hit.el;
    const el = card(it);
    // набранный текст и примечание (К-17) переходят в новую редакцию
    for (const sel of [".free input", ".human-note"]) {
      const was = hit && hit.el.querySelector(sel), now = el.querySelector(sel);
      if (was && now && was.value && !now.value) now.value = was.value;
    }
    cardCache.set(it.id, {sig, el});
    return el;
  }
  // 9.3: карточка, где ответ не внесётся. Варианты, голос и своё поле не показываются: ответ всё равно не внесётся.
  // Главное действие — «Оставить как есть» (= «Пропустить»); следующий шаг — словами для Claude, по состоянию места.
  function staleView(it, a, state) {
    const box = document.createElement("div"); box.className = "note stale"; box.dataset.kind = "warn";
    const add = (tag, text, cls) => { const el = document.createElement(tag); el.textContent = text; if (cls) el.className = cls; box.append(el); return el; };
    const open = conditionOf(it).place_open ? "open" : "closed";
    add("b", STALE_TITLE);
    add("span", `${STALE_WHY} ${STALE_PLACE[open]}`);
    const d = document.createElement("details"), sum = document.createElement("summary"), list = document.createElement("ol");
    sum.textContent = "Прежний вопрос карточки";
    (it.options || []).forEach(o => { const li = document.createElement("li"); li.textContent = o.label; list.append(li); });
    const q = document.createElement("p"); q.textContent = it.question || "";
    d.append(sum, q, list); box.append(d);
    const row = document.createElement("div"); row.className = "row";
    const keep = document.createElement("button"); keep.className = "btn primary"; keep.type = "button"; keep.textContent = "Оставить как есть";
    if (a && kindOf(a) === "skip") keep.setAttribute("aria-pressed", "true");
    keep.onclick = () => send(it, {kind: "skip", text: "пропущено"}, state);
    row.append(keep); box.append(row);
    add("span", STALE_KEEP, "side");
    add("span", STALE_STEP[open].replace("{n}", String(man.items.indexOf(it) + 1)));
    return box;
  }
  function card(it) {
    const a = answers[it.id];
    const c = document.createElement("article");
    c.className = "card"; c.dataset.id = it.id; c.dataset.rev = String(revOf(it)); c.dataset.done = needsAnswer(it) ? "0" : "1"; c.dataset.applied = appliedCard(it, a) ? "1" : "0";
    const head = document.createElement("div"); head.className = "head";

    (it.reasons || []).forEach(r => { const s = document.createElement("span"); s.className = "chip"; s.textContent = chipText(it, r); head.querySelector(".reasons").append(s); });
    if (revOf(it) > 1) { const s = document.createElement("span"); s.className = "chip"; s.textContent = "вопрос обновлён"; head.querySelector(".reasons").append(s); }
    c.append(head);

    const listenKey = `${it.id}#${revOf(it)}`;
    if (!man.clips_removed && it.clip && clipFailed.has(listenKey)) c.append(clipFailedNote());
    else if (!man.clips_removed && it.clip) {    // карточка без звука: нет исходной записи или клип не нарезался

      au.addEventListener("error", () => {

    const ctx = document.createElement("div"); ctx.className = "ctx";

    if (it.after) { const q = document.createElement("p"); q.className = "side"; q.textContent = it.after; ctx.append(q); }

        `промежуток без слов ${seconds(candidate.duration_seconds)} с, порог ${seconds(d.threshold_seconds)} с. ` +

        const bb = document.createElement("button"); bb.className = noUndo ? "btn primary" : "btn"; bb.type = "button"; bb.textContent = "Вернуть как было";

        eb.onclick = () => { editing.add(it.id); render(); };
        er.append(eb);

      h.textContent = canHear ? LISTEN_FIRST : NO_CLIP_LISTEN; c.append(h);
    }

    const row = document.createElement("div"); row.className = "row";
    const mk = (label, fn, pressed) => { const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = label; b.onclick = fn; if (pressed) b.setAttribute("aria-pressed", "true"); row.append(b); return b; };
    mk("Оставить человеку", () => send(it, {kind: "human"}, state), a && a.kind === "human").title =
      "Место останется вам; это ничего не подтверждает: слова и говорящий не отмечаются как проверенные";
    if (editing.has(it.id)) mk("Не менять", () => { editing.delete(it.id); render(); });
    if (revertInEdit(it, a)) {        // К-В3: отмена ответа — внутри «Изменить ответ»
      const rv = revertButton(it, a);
      mk(rv.label, () => send(it, {kind: rv.kind}, state)).title = rv.title;
    }
    mk("Пропустить", () => send(it, {kind: "skip", text: "пропущено"}, state), a && a.kind === "skip");
    if ("speechSynthesis" in window) mk("Озвучить вопрос", () => speak(it));
    if (api.voiceMode === "record" && window.MediaRecorder && navigator.mediaDevices) {
      let rec = null, chunks = [];
      const b = mk("Ответить голосом", async () => {
        if (rec) { rec.stop(); return; }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({audio: true});
          rec = new MediaRecorder(stream); chunks = [];
          rec.ondataavailable = e => chunks.push(e.data);
          rec.onstop = async () => {
            stream.getTracks().forEach(t => t.stop()); b.classList.remove("rec-on"); b.textContent = "Ответить голосом";
            const blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"}); rec = null;
            state.textContent = "Распознаю ответ…";
            try { voiceResult(it, await api.voice(it, blob), state); }
            catch (e) { if (!(await staleShown(e, it, STALE_CHOICE_TEXT))) state.textContent = "Не получилось: " + e.message; }
          };
          rec.start(); b.classList.add("rec-on"); b.textContent = "Стоп";
        } catch (e) { state.textContent = "Микрофон недоступен: " + e.message; }
      });
    } else if (api.voiceMode === "file") {
      const id = `voice-${it.id}`;
      const lab = document.createElement("label"); lab.className = "btn"; lab.htmlFor = id; lab.textContent = "Голосовой ответ (запись)";
      const inp = document.createElement("input"); inp.type = "file"; inp.accept = "audio/*"; inp.capture = "user"; inp.id = id; inp.hidden = true;
      inp.onchange = async () => { const f = inp.files[0]; if (!f) return; state.textContent = "Загружаю запись…";
        try { await api.voice(it, f); render(); } catch (e) { state.textContent = "Не загрузилось: " + e.message; } };
      row.append(lab, inp);
    }
    c.append(row);

    const free = document.createElement("form"); free.className = "free";
    const inp = document.createElement("input"); inp.id = `free-${it.id}`; inp.placeholder = it.answer_mode === "speaker"
      ? "Кто говорит: имя (как в записи) или «Имя: точные слова»; пояснения — не сюда"
      : "Свой ответ: имя, «не Анна, а Вера» или «Имя: точные слова»";
    const ok = document.createElement("button"); ok.className = "btn"; ok.type = "submit"; ok.textContent = "Записать";
    if (a && kindOf(a) === "free" && editing.has(it.id)) inp.value = a.text || "";   // «Изменить ответ» — с прежним текстом
    free.append(inp, ok);
    if (LOCAL && api.preview) {
      const preview = document.createElement("button"); preview.type = "button"; preview.className = "btn"; preview.textContent = "Предпросмотр";
      preview.onclick = async () => { if (!inp.value.trim()) return; state.textContent = "Проверяю без записи…";
        try { const r = await api.preview(it, inp.value.trim());
          state.textContent = previewText(it, r);
        } catch (e) { if (!(await staleShown(e, it))) state.textContent = "Предпросмотр недоступен: " + e.message; } };
      free.append(preview);
    }
    free.onsubmit = (e) => { e.preventDefault(); if (inp.value.trim()) send(it, {text: inp.value.trim()}, state); };
    c.append(free);
    if (it.seen_fp) {
      const noteRow = document.createElement("div"); noteRow.className = "free";
      const note = document.createElement("input"); note.className = "human-note";
      note.placeholder = "Примечание (необязательно): записывается в историю места, когда ответ применён; в стенограмму не попадает";
      noteRow.append(note); c.append(noteRow);
    }
    c.append(state);
    return c;
  }

  function render() {
    if (!man) return;
    const list = $("list");
    const done = man.items.filter(it => !needsAnswer(it)).length;
    $("count").textContent = `${done} / ${man.items.length}`;
    $("apply").textContent = applyLabel();
    $("meter").style.width = `${man.items.length ? 100 * done / man.items.length : 0}%`;
    const show = man.items.filter(it => showAll || needsAnswer(it));
    const active = document.activeElement && document.activeElement.id;
    list.replaceChildren(...(show.length ? show.map(cardFor) : [Object.assign(document.createElement("div"),
      {className: "empty", textContent: emptyText()})]));
    if (cardObserver) list.querySelectorAll(".card").forEach(c => cardObserver.observe(c));
    else list.querySelectorAll(".card").forEach(c => {
      const id = c.dataset.id, key = `${id}#${c.dataset.rev}`;
      if (!visibleThisSession.has(key)) {
        visibleThisSession.add(key);
        const it = man.items.find(item => item.id === id);
        if (it) sendInteraction(it, "card_rendered");
      }
    });
    if (active && $(active)) $(active).focus();
  }

  function header() {
    $("title").textContent = "Разбор: " + (man.audio || "").replace(/\.[^.]+$/, "");
    $("sub").textContent = `${man.items.length} мест · версия ${man.version}` + (man.pack_rev ? ` · карточки обновлялись: ${man.pack_rev}` : "") +
      (LOCAL ? " · на этом компьютере" : " · облако");
  }
  // Карточки заменены или дописаны в том же пакете (или пакет пересобран): новый manifest; render перерисует
  // только изменённые и новые карточки.
  async function reloadManifest() {
    const r = await fetch("manifest.json", {cache: "no-store"});
    if (!r.ok) throw new Error("manifest.json не найден");
    man = await r.json(); header();
  }

  $("f-open").onclick = () => { showAll = false; $("f-open").setAttribute("aria-pressed", "true"); $("f-all").setAttribute("aria-pressed", "false"); render(); };
  $("f-all").onclick = () => { showAll = true; $("f-all").setAttribute("aria-pressed", "true"); $("f-open").setAttribute("aria-pressed", "false"); render(); };
  $("apply").onclick = async () => {
    if (!confirm("Применить сохранённые ответы к стенограмме? Ответ, который внести не получится, останется на карточке с причиной и следующим шагом.")) return;
    const box = $("apply-report"); box.hidden = false; box.textContent = "Применяю…"; $("apply").disabled = true;
    try { const rep = await api.apply(); const lines = reportLines(rep, man.items);
      box.style.whiteSpace = "pre-line";
      box.textContent = lines.length ? lines.join("\n") : "Применять нечего: новых ответов нет. Карточки, где нужно ваше действие, — в списке «без ответа»."; showAll = true; render(); }
    catch (e) { box.textContent = "Не удалось применить: " + e.message; }
    finally { $("apply").disabled = false; }
  };

  async function start() {
    try {
      const r = await fetch("manifest.json", {cache: "no-store"});
      if (!r.ok) throw new Error("manifest.json не найден");
      man = await r.json();
    } catch (e) { $("sub").textContent = "Пакет разбора не найден: " + e.message; return; }
    header();
    answers = merge();
    if (man.applied) { showAll = true; $("f-all").setAttribute("aria-pressed", "true"); $("f-open").setAttribute("aria-pressed", "false");
      note(`Ответы применены к стенограмме ${when(man.applied_at)}.` + (man.clips_removed ? " Клипы удалены." : "")
           + " Любой ответ можно изменить или отменить — изменения применятся по команде «применяй ответы».", ""); }
    try {
      api = LOCAL ? localApi() : await cloudApi();
      answers = await api.load();
      $("apply").hidden = !LOCAL;
      api.subscribe();
      // вернулись на вкладку: карточки могли замениться или дописаться, пока страница была скрыта
      if (LOCAL) document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") refreshOnReturn();
      });
      if (!LOCAL && !man.applied) note(api.voiceMode ? "Голосовой ответ — файлом с диктофона (m4a или webm). Ответы применяются на ноутбуке." :
                                       "Голосовые ответы здесь недоступны — отвечайте касанием или текстом.");
    } catch (e) {
      api = {voiceMode: null, async load() { return merge(); }, async answer() { throw new Error("ответы сохранить негде"); }, subscribe() {}};
      if (!man.applied) note("Сохранение ответов недоступно в этом просмотре: откройте страницу под своей учётной записью.", "warn");
    }
    render();
  }
  start();
})();
</script>
