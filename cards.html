<title>Разбор расшифровки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Лента карточек: сводка сверху, одна колонка мест; у каждого — клип, реплика с местом, вопрос, варианты. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#d9dfd9;
  --accent:#0d6e5b; --accent-ink:#ffffff; --mark:#f5d76e; --mark-ink:#1d2420;
  --ok:#2f7d3a; --warn:#a15c00; --info:#2c5aa0;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --fg:#e4ebe6; --muted:#9aa8a0; --line:#2e3833;
  --accent:#3fb59a; --accent-ink:#0b1310; --mark:#8a7322; --mark-ink:#fff6d6;
  --ok:#6cc27a; --warn:#e2a64b; --info:#7fa8e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --fg:#e4ebe6; --muted:#9aa8a0; --line:#2e3833;
  --accent:#3fb59a; --accent-ink:#0b1310; --mark:#8a7322; --mark-ink:#fff6d6;
  --ok:#6cc27a; --warn:#e2a64b; --info:#7fa8e6; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:16px}
header{display:grid;gap:8px}
h1{font:600 1.55rem/1.15 var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--muted);margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.meter{flex:1 1 180px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.count{font:500 .9rem var(--f-mono);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px}
.chip{font:500 .78rem var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);background:transparent}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{border-left:3px solid var(--info);padding:6px 10px;color:var(--muted);background:var(--surface);font-size:.9rem}
.note[data-kind="warn"]{border-color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card[data-done="1"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.tc{font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums}
.who{font-weight:600}
.reasons{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.ctx{display:grid;gap:4px;font-size:.93rem;min-width:0}
.ctx .side{color:var(--muted)}
.ctx p{margin:0;overflow-wrap:anywhere;white-space:pre-line}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}
audio{width:100%;height:36px}
.q{font-weight:600;margin:0}
.opts{display:grid;gap:6px}
.opt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:flex-start;text-align:left;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .n{font:500 .85rem var(--f-mono);color:var(--muted);min-width:1.2em}
.opt .lbl{flex:1 1 0;min-width:8em;overflow-wrap:anywhere}
.opt small{flex:1 1 100%;min-width:0;padding-left:calc(1.2em + 10px);color:var(--muted);overflow-wrap:anywhere}
.opt[aria-pressed="true"] small{color:var(--accent-ink)}
.opt .rec{font:500 .72rem var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt[aria-pressed="true"] .n,.opt[aria-pressed="true"] .rec{color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 .88rem var(--f-body);padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn.rec-on{background:#c0392b;color:#fff;border-color:#c0392b}
.free{display:flex;gap:8px;flex-wrap:wrap}
.free input{flex:1 1 220px;min-width:0;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.state{font-size:.86rem;color:var(--muted);min-height:1.2em}
.state b{color:var(--ok);font-weight:600}
.last{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line))}
.last .k{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ok)}
.last .v{font-weight:600;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;flex:1 1 100%}
.last .m{font:400 .8rem var(--f-mono);color:var(--muted)}
.card[data-applied="1"] .opts,.card[data-applied="1"] .row,.card[data-applied="1"] .free{display:none}
.edit-row{display:none;flex-wrap:wrap;gap:8px}
.card[data-applied="1"] .edit-row{display:flex}
.last[data-pending="1"]{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.last[data-pending="1"] .k{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#list{display:grid;gap:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1 id="title">Разбор расшифровки</h1>
    <p class="sub" id="sub">Загружаю пакет разбора…</p>
    <div class="bar">
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <span class="count" id="count">0 / 0</span>
      <div class="filters" role="group" aria-label="Показать">
        <button class="chip" id="f-open" aria-pressed="true">без ответа</button>
        <button class="chip" id="f-all" aria-pressed="false">все</button>
      </div>
    </div>
    <div class="note" id="mode-note" hidden></div>
    <button class="btn" id="apply" type="button" hidden>Применить сохранённые ответы</button>
    <div class="note" id="apply-report" hidden aria-live="polite"></div>
  </header>
  <main id="list"><div class="empty" id="empty">Пакет ещё не загружен. Здесь появятся сомнительные места расшифровки: клип, реплика с выделенным местом и варианты ответа.</div></main>
</div>

<script>
(() => {
  "use strict";
  const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const REASONS = {asr: "модели расходятся", conf: "модель не уверена", voice: "голоса похожи",
                   overlap: "говорят вместе", gender: "род глагола", missed: "пропущена речь",
                   contradiction: "противоречие"};
  const NUM = ["1", "2", "3", "4"];
  // К-6: у места сбоя прохода (asr_state не disagreement) чип не говорит «модели расходятся»
  const chipText = (it, r) => r === "asr" && it.asr_state && it.asr_state !== "disagreement" ? "сбой распознавания" : REASONS[r] || r;
  let man = null, answers = {}, live = {}, showAll = false, api = null;
  const pageSession = typeof window !== "undefined" && window.crypto && window.crypto.randomUUID ?
    window.crypto.randomUUID() :
    `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  // Номер редакции карточки: замена карточки в том же пакете растит его; ответ и событие несут номер своей редакции.
  const revOf = (it) => (it && it.rev) || 1;
  const STALE = "вопрос обновлён";
  const visibleThisSession = new Set();          // «id#редакция»: заменённая карточка показывается заново
  const sendInteraction = (it, type) => {
    if (api && api.event) api.event({id: it.id, version: man.version, rev: revOf(it), type, session: pageSession}).catch(() => {});
  };
  const cardObserver = typeof window !== "undefined" && "IntersectionObserver" in window ?
    new window.IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting || entry.intersectionRatio < 0.5) return;
      const id = entry.target.dataset.id, key = `${id}#${entry.target.dataset.rev}`;
      if (visibleThisSession.has(key)) return;
      visibleThisSession.add(key);
      const it = man.items.find(item => item.id === id);
      if (it) sendInteraction(it, "card_visible");
      cardObserver.unobserve(entry.target);
    });
    }, {threshold: 0.5}) : null;
  const editing = new Set();          // карточки с применённым ответом, которые сейчас меняют
  // вид ответа: страница в облаке пишет свободный текст без kind — тогда это свой ответ
  const kindOf = (a) => a.kind || (a.option != null ? "option" : (a.text ? "free" : ""));
  // Состояние ответа считает программа на ноутбуке (answer_states): страница его только показывает.
  // Ответ, которого ноутбук ещё не видел (облако), — «сохранён в облаке»; страничное исключение —
  // «Не отменять» из облака (cloud_keep): до переноса на ноутбук применённый ответ на месте.
  const stateOf = (it, a) => {
    if (!a) return "";
    const st = (man.answer_states || {})[it.id];
    if (st && st.ts === a.ts && st.source === a.source) return st.state;
    if (LOCAL) return "saved";
    return kindOf(a) === "keep" ? "cloud_keep" : "cloud_saved";
  };
  // «Не отменять» из облака, который ноутбук уже обработал (принял или отклонил): страница показывает
  // ответ программы, а не свой запрос.
  const keepSeen = (a) => {
    const k = ((man.answer_states || {})[a.id] || {}).keep;
    return kindOf(a) === "keep" && !!k && k.ts === a.ts && k.source === a.source;
  };
  const whyOf = (it) => ((man.answer_states || {})[it.id] || {}).why || "";
  const detailOf = (it) => ((man.answer_states || {})[it.id] || {}).detail || "";
  // применённая правка на месте: прежний ответ (новый ждёт отмены или не меняет его)
  // undo_conflict: отмена не выполнилась — прежняя правка на месте, кнопки «Изменить» и «Отмена» нужны
  // revert_pending: отмена подготовлена, но не применена — правка тоже ещё на месте
  // cloud_keep: отмена снята в облаке — применённая правка на месте
  // applied_open: ответ применён, место осталось открытым (PR 7) — правка на месте, отмена доступна
  // applied_check: применён более поздний из расходившихся ответов ноутбука и облака (К-23) — проверить
  const holdsApplied = (it, a) => ["applied", "applied_open", "applied_check", "pending_new", "kept_previous",
                                   "undo_conflict", "revert_pending", "cloud_keep"].includes(stateOf(it, a));
  // «Ответ верен — оставить» (К-23): тот же применённый ответ ещё раз от человека на ноутбуке закрывает место
  const confirmAnswer = (it) => {
    const sig = (man.applied_answers || {})[it.id];
    if (!Array.isArray(sig)) return null;
    const [kind, option, text] = sig;
    if (kind === "option" && option != null) return {option};
    if (kind === "recommended") return {kind};
    if (kind === "free" && text) return {kind, text};
    return null;
  };
  const hasConflict = (it) => (man.conflicts || []).some(c => c.id === it.id);
  // Вторая кнопка у применённого ответа: при подготовленной отмене — «Не отменять», иначе — «Подготовить отмену».
  const revertButton = (it, a) => stateOf(it, a) === "revert_pending" ?
    {label: "Не отменять", kind: "keep", title: "Оставить применённый ответ; подготовленная отмена снимается."} :
    {label: "Подготовить отмену", kind: "revert",
     title: "Затем нажмите «Применить сохранённые ответы». Отмена может быть отклонена, если место изменилось."};
  const pending = (it, a) => stateOf(it, a) === "pending_new";
  // Что сказано об ответе под заголовком. Ответ «отменить» описывается по состоянию: пока отмена не прошла,
  // прежний ответ на месте, и строка не должна говорить «ответ отменён».
  const REVERT_TEXT = {revert_pending: "отмена подготовлена — прежний ответ пока на месте",
                       undo_conflict: "отмена не выполнена — прежний ответ на месте",
                       reverted: "ответ отменён — место снова открыто"};
  function answerText(a, it) {
    const kind = kindOf(a);
    if (kind === "revert") return REVERT_TEXT[stateOf(it, a)] || "отмена ответа";
    if (kind === "keep") return "отмена снята — применённый ответ остаётся";
    let what = {human: "оставлено человеку", skip: "пропущено", voice: "голосовой ответ — распознается на ноутбуке",
                free: `свой ответ: «${a.text || ""}»`}[kind] || kind || "ответ";
    if (kind === "human" && a.text) what += ` («${a.text}»)`;
    if (a.option != null && it.options && it.options[a.option] && (kind === "option" || kind === "recommended"))
      what = `${a.option + 1} — ${it.options[a.option].label}`;
    return what;
  }
  // Откуда и когда ответ. Ответ, собранный заново по «Не отменять» в старом пакете, времени прежнего ответа не знает.
  function answerMeta(a) {
    const where = a.source === "local" ? "ноутбук" : "облако";
    if (a.restored) return `${where} — возвращён применённый ответ`;
    return `${where} · ${when(a.ts)}` + (a.heard && a.text && kindOf(a) !== "free" ? ` · услышано «${a.text}»` : "");
  }
  const appliedCard = (it, a) => holdsApplied(it, a) && !editing.has(it.id);
  // Причина и уточнение программы под ответом. У ответа из облака, которого ноутбук ещё не видел, их нет:
  // то, что знает программа, относится к прежнему ответу.
  function programNote(it, a) {
    const state = stateOf(it, a), cloud = ["cloud_saved", "cloud_keep"].includes(state);
    const reason = cloud || ["applied", "saved"].includes(state) ? "" : whyOf(it);
    return [reason, cloud ? "" : detailOf(it)].filter(Boolean).join(" — ");
  }
  // Заголовок карточки для каждого исхода программы (OUTCOME_REASONS в review_pack.py) и для ответа из облака.
  // Неуспешные исходы — «не применён — …» с краткой причиной; полная причина — строкой под ответом.
  const STATUS = {saved: "ответ сохранён", applied: "применён ответ", pending_new: "новый ответ — не применён",
                  applied_open: "применён ответ, место открыто — нужно прослушивание",
                  revert_pending: "отмена подготовлена — нажмите «Применить»; прежний ответ на месте",
                  kept_previous: "применён прежний ответ", reverted: "ответ отменён", skipped: "пропущено",
                  negative: "не применён — место открыто", left_for_human: "требует проверки",
                  already_decided: "место уже решено — ничего не изменилось",
                  apply_conflict: "не применён — слова изменились", blocked_preflight: "не применён — пересекается с другой карточкой",
                  undo_conflict: "отмена не выполнена — прежний ответ на месте",
                  source_conflict: "не применён — стенограмма изменилась", not_found: "не применён — место не найдено",
                  not_applied: "не применён", pause_refused: "не применён — нужна кнопка паузы",
                  applied_check: "применён — проверьте: ответы ноутбука и облака расходились",
                  listen_mismatch: "не применён — ответ не совпадает со словами",
                  hint: "не применён — см. подсказку", cloud_saved: "сохранён в облаке — не применён",
                  cloud_keep: "отмена снята — перенесётся на ноутбук; применённый ответ на месте"};
  // Заголовок — состояние ответа; расхождение ответов ноутбука и облака — отдельной строкой под ответом (К-23).
  const cardStatus = (it, a) =>
    stateOf(it, a) === "saved" && kindOf(a) === "human" ? "требует проверки" : STATUS[stateOf(it, a)] || "не применён";
  const CONFLICT_TEXT = "ответы ноутбука и облака расходились — проверьте";
  // Строки отчёта «Применить»: исход каждого ответа по номеру карточки, с уточнением программы.
  function reportLines(rep, items) {
    const lines = [];
    const cardName = (id, n) => { const it = items.find(x => x.id === id); n = n || (items.indexOf(it) + 1);
      return `Карточка ${n || id}` + (it && it.t ? ` (${it.t})` : ""); };
    (rep.outcomes || []).forEach(o => lines.push(`${cardName(o.id, o.card)}: ${o.why}` + (o.detail ? ` — ${o.detail}` : "")));
    if (rep.free_text) (rep.free_text.cards || []).forEach(c => { if (c.was_now) lines.push(`${cardName(c.id)}: ${c.was_now}`); });
    (rep.cards_not_replaced || []).forEach(c => lines.push(`${cardName(c.id)}: новая редакция карточки не создана` +
      (c.why ? ` (${c.why})` : "") + " — нажмите «Применить сохранённые ответы» ещё раз"));
    (rep.answers_not_carried || []).forEach(c => lines.push(`${cardName(c.id)}: ваш ответ на прежнюю редакцию не применён — ответьте на карточке заново`));
    if (rep.source_conflict) lines.push("Конфликт источника: " + rep.source_conflict);
    if (rep.voice_profile_warning && rep.voice_profile_warning.message) lines.push(rep.voice_profile_warning.message);
    return lines;
  }
  // ответы этой версии вопросов из базы страницы: {id: ответ}, при повторах — более поздний
  function pick(list) {
    const o = {}, items = new Map((man.items || []).map(it => [it.id, it]));
    // ответ прежней редакции заменённой карточки к новому вопросу не относится (он в истории карточки)
    list.filter(a => a && a.id && a.version === man.version && (!items.has(a.id) || (a.rev || 1) === revOf(items.get(a.id))))
        .forEach(a => { if (!o[a.id] || (a.ts || "") > (o[a.id].ts || "")) o[a.id] = a; });
    return o;
  }
  // снимок ответов с ноутбука (в manifest) + ответы страницы: на каждое место — последний по времени
  function merge() {
    const o = {...pick(Object.values(man.answers || {}))};
    Object.values(live).forEach(a => { if (keepSeen(a)) return; if (!o[a.id] || (a.ts || "") > (o[a.id].ts || "")) o[a.id] = a; });
    return o;
  }
  const $ = (id) => document.getElementById(id);

  // ---------- прослойка: localhost (ноутбук) или база страницы (облако) ----------
  function localApi() {
    return {
      voiceMode: "record",
      async load() { const r = await fetch("api/answers"); if (!r.ok) throw new Error(r.status); const s = await r.json();
        // карточки заменены или дописаны (pack_rev) или пакет пересобран (version): перечитать manifest.json
        if (s.pack_version !== undefined && (s.pack_version !== man.version || (s.pack_rev || 0) !== (man.pack_rev || 0))) await reloadManifest();
        man.applied_answers = s.applied_answers || {}; man.answer_states = s.answer_states || {}; man.conflicts = s.conflicts || []; man.applied_at = s.applied_at; live = pick(Object.values(s.answers || {})); return merge(); },
      async answer(a) {
        const r = await fetch("api/answer", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(a)});
        const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
        answers = await this.load(); return j;
      },
      async event(e) {
        const r = await fetch("api/event", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(e)});
        if (!r.ok) throw new Error(r.status);
        return r.json();
      },
      async voice(it, blob) {

  async function cloudApi() {
    const db = await claude.use("db");
    const assets = await claude.use("assets");
    if (!db) throw new Error("db");
    const col = db.collection("answers");
    return {
      voiceMode: assets ? "file" : null,
      async load() { const s = await col.get(); live = pick(s.docs.map(d => d.data())); return merge(); },
      async answer(a) {
        const doc = {...a, source: "cloud", ts: new Date().toISOString().slice(0, 19)};
        live[a.id] = doc; answers = merge(); render();
        await col.doc(`${man.version}--${a.id}`).set(doc); return {};
      },
      async voice(it, file) {
        const t = (file.type || "").toLowerCase();
        const type = t.includes("webm") ? "video/webm" : (t.includes("mp4") || t.includes("m4a") || t.includes("aac")) ? "video/mp4" : null;
        if (!type) throw new Error("Нужна запись m4a/mp4 или webm (диктофон телефона подходит).");
        const up = await assets.upload(file, {type});
        return this.answer({id: it.id, version: man.version, rev: revOf(it), kind: "voice", audio_id: up.id});
      },
      subscribe() {
        let timer = setTimeout(() => note("Ответы из базы пока не получены — показываю без них.", "warn"), 10000);
        col.onSnapshot(s => {
          if (!s.metadata.fromCache) clearTimeout(timer);
          live = pick(s.docs.map(d => d.data())); answers = merge(); render();
        }, () => clearTimeout(timer));
      }
    };
  }

  function note(text, kind) { const n = $("mode-note"); n.textContent = text; n.dataset.kind = kind || ""; n.hidden = !text; }

  function optionPreview(decision) {
    const d = decision || {}, parts = [];
    if (d.text) parts.push(`текст → «${d.text}»`);
    if (d.speaker) parts.push(`говорящий → ${d.speaker}`);
    if (d.human_after || d.status === "human") parts.push("оставить человеку для проверки");
    if (d.reopen) parts.push("снова открыть место");
    if (d.listened === "silence") parts.push("подтвердить после прослушивания: тишина");
    if (d.listened === "words") parts.push("подтвердить после прослушивания: слова верны");
    if (d.listened === "interjections") parts.push("подтвердить после прослушивания: только междометия, не записывать");
    if (d.note) parts.push(`примечание: ${d.note}`);
    // номера слов человеку ничего не говорят: показываем, сколько слов места подтверждается
    if (Array.isArray(d.word_ids)) parts.push(`подтвердить говорящего у слов места (${d.word_ids.length})`);
    const other = Object.keys(d).filter(k => !["text", "speaker", "human_after", "status", "reopen", "note", "listened", "word_ids"].includes(k));
    if (other.length) parts.push("другие параметры: " + other.map(k => `${k}: ${JSON.stringify(d[k])}`).join(", "));
    return parts.join("; ") || "оставить как есть";
  }

  // ---------- отрисовка ----------
  function markReply(reply) {
    const frag = document.createDocumentFragment();

      if (part.startsWith("⟦")) { const m = document.createElement("mark"); m.textContent = part.slice(1, -1); frag.append(m); }
      else frag.append(document.createTextNode(part));

  }
  function describe_unused(a, it) {

    let what = {human: "оставлено человеку", skip: "пропущено", voice: "голосовой ответ, ждёт распознавания на ноутбуке",
                free: `свой ответ: «${a.text || ""}»`}[a.kind];
    if ((a.kind === "option" || a.kind === "recommended") && a.option != null) what = `вариант ${a.option + 1}: ${it.options[a.option].label}`;

  }

  function speak(it) {

  // примечание человека — только на карточке противоречия (PR 13б, В-3); ответом оно не разбирается

  async function send(it, a, stateEl) {

      const note = humanNote(it, stateEl);
      const r = await api.answer({id: it.id, version: man.version, rev: revOf(it), ...a, ...(note ? {human_note: note} : {})});
      const acc = (r.accepted || [])[0];

      else if (rejected) flash(it.id, "Не принято: " + r.rejected[0].why);
      else if (acc && acc.note) flash(it.id, "Не записано: " + acc.note);
      else if (a.kind === "keep") flash(it.id, "Отмена снята: применённый ответ остаётся");
      else if (a.kind === "revert") flash(it.id, "Отмена подготовлена: нажмите «Применить сохранённые ответы»");

  const STALE_TEXT = "Не принято: вопрос обновлён — карточка показана заново, ваш текст остался в поле";
  // Отказ «вопрос обновлён» на голос или предпросмотр: забрать новую редакцию и показать её.

  function flash(id, text) { const el = document.querySelector(`[data-id="${id}"] .state`); if (el) el.textContent = text; }

  // Прежние редакции заменённой карточки и ответы на них: на новый вопрос ответ не переносится.
  function historyNote(it) {
    const box = document.createElement("div"); box.className = "note"; box.style.whiteSpace = "pre-line";
    box.textContent = it.history.map(h => {
      const a = h.answer, opts = h.options || [];
      let what = "ответа не было";
      if (a) what = (a.option != null && opts[a.option] ? `ответ: ${a.option + 1} — ${opts[a.option].label}` :
        a.text ? `ответ: «${a.text}»` : "ответ: " + ({human: "оставлено человеку", skip: "пропущено"}[kindOf(a)] || kindOf(a))) +

  function render() {

  function header() {
    $("title").textContent = "Разбор: " + (man.audio || "").replace(/\.[^.]+$/, "");
    $("sub").textContent = `${man.items.length} мест · версия ${man.version}` + (man.pack_rev ? ` · карточки обновлялись: ${man.pack_rev}` : "") +
      (LOCAL ? " · на этом компьютере" : " · облако");
  }
  // Карточки заменены или дописаны в том же пакете (или пакет пересобран): новый manifest; render перерисует
  // только изменённые и новые карточки.
  async function reloadManifest() {
    const r = await fetch("manifest.json", {cache: "no-store"});
    if (!r.ok) throw new Error("manifest.json не найден");
    man = await r.json(); header();
  }

  $("f-open").onclick = () => { showAll = false; $("f-open").setAttribute("aria-pressed", "true"); $("f-all").setAttribute("aria-pressed", "false"); render(); };
  $("f-all").onclick = () => { showAll = true; $("f-all").setAttribute("aria-pressed", "true"); $("f-open").setAttribute("aria-pressed", "false"); render(); };
  $("apply").onclick = async () => {
    if (!confirm("Применить сохранённые ответы к стенограмме? Отмена возможна только при наличии снимка и отсутствии более поздних конфликтующих правок.")) return;
    const box = $("apply-report"); box.hidden = false; box.textContent = "Применяю…"; $("apply").disabled = true;
    try { const rep = await api.apply(); const lines = reportLines(rep, man.items);
      box.style.whiteSpace = "pre-line";
      box.textContent = lines.length ? lines.join("\n") : "Новых изменений нет. Проверьте сохранённые ответы."; showAll = true; render(); }
    catch (e) { box.textContent = "Не удалось применить: " + e.message; }
    finally { $("apply").disabled = false; }
  };

  async function start() {
    try {
      const r = await fetch("manifest.json", {cache: "no-store"});
      if (!r.ok) throw new Error("manifest.json не найден");
      man = await r.json();
    } catch (e) { $("sub").textContent = "Пакет разбора не найден: " + e.message; return; }
    header();
    answers = merge();
    if (man.applied) { showAll = true; $("f-all").setAttribute("aria-pressed", "true"); $("f-open").setAttribute("aria-pressed", "false");
      note(`Ответы применены к стенограмме ${when(man.applied_at)}.` + (man.clips_removed ? " Клипы удалены." : "")
           + " Любой ответ можно изменить или отменить — изменения применятся по команде «применяй ответы».", ""); }
    try {
      api = LOCAL ? localApi() : await cloudApi();
      answers = await api.load();
      $("apply").hidden = !LOCAL;
      api.subscribe();
      // вернулись на вкладку: карточки могли замениться или дописаться, пока страница была скрыта
      if (LOCAL) document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") api.load().then(a => { answers = a; render(); }).catch(() => {});
      });
      if (!LOCAL && !man.applied) note(api.voiceMode ? "Голосовой ответ — файлом с диктофона (m4a или webm). Ответы применяются на ноутбуке." :
                                       "Голосовые ответы здесь недоступны — отвечайте касанием или текстом.");
    } catch (e) {
      api = {voiceMode: null, async load() { return merge(); }, async answer() { throw new Error("ответы сохранить негде"); }, subscribe() {}};
      if (!man.applied) note("Сохранение ответов недоступно в этом просмотре: откройте страницу под своей учётной записью.", "warn");
    }
    render();
  }
  start();
})();
</script>
